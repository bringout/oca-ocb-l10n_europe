[project]
name = "odoo-bringout-oca-ocb-l10n_account_edi_ubl_cii_tests"
version = "16.0.0"
description = "Testing the Import/Export invoices with UBL/CII - 
        Odoo addon
        "
authors = [
    { name = "Ernad Husremovic", email = "hernad@bring.out.ba" }
]
dependencies = [
    "odoo-bringout-oca-ocb-account_edi_ubl_cii>=17.0.0",
    "odoo-bringout-oca-ocb-l10n_fr>=17.0.0",
    "odoo-bringout-oca-ocb-l10n_be>=17.0.0",
    "odoo-bringout-oca-ocb-l10n_de>=17.0.0",
    "odoo-bringout-oca-ocb-l10n_nl>=17.0.0",
    "odoo-bringout-oca-ocb-l10n_au>=17.0.0",
    "requests>=2.25.1"
]
readme = "README.md"
requires-python = ">= 3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

[project.urls]
homepage = "https://git.hodi.ba/bringout/project-0"
repository = "https://git.hodi.ba/bringout/project-0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["l10n_account_edi_ubl_cii_tests"]

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=8.4.1",
]
